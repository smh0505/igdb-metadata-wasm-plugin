[package]
name = "igdb-metadata-wasm-plugin"
version = "0.2.0"
edition = "2024"

[dependencies]
wit-bindgen-rt = { version = "0.44.0", features = ["bitflags"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

[lib]
crate-type = ["cdylib"]

[package.metadata.component]
package = "gamelib:plugin"
target = { world = "metadata-plugin-world", path = "wit/plugin.wit" }

[package.metadata.component.dependencies]
