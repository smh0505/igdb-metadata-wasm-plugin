name: Notify Registry

# On every published release, tells concourse-plugin-registry a new version exists so it can
# open a bump PR (see that repo's bump-from-release.yml). This only notifies - the registry
# repo does its own independent download+hash, and a human still reviews/merges the PR before
# the new version is trusted by anyone installing from the registry.
on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to concourse-plugin-registry
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_DISPATCH_TOKEN }}
        run: |
          gh api repos/smh0505/concourse-plugin-registry/dispatches \
            -f event_type=plugin-release \
            -f "client_payload[repo]=${{ github.repository }}" \
            -f "client_payload[tag]=${{ github.event.release.tag_name }}"
